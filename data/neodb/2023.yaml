  comment_text: 就单个作品来看，故事有些暧昧不清，想塞的内容太多，很多地方情感还没渲染起来，情节已经迅速推进。又想搞绚丽的大场面，又想卖角色之间的暧昧互动，又想掉书袋讲概念，已经完全超出了剧场版可以承载的体量。但放在系列里讲，这部还算是承前启后，又不失悬念的衔接之作。很遗憾，这又仅仅只是一部粉丝向的作品，充分地再次证明IP商法的惊人成功。
