- uuid: 6bSYa7eaQsxwolsaKMHM4F
  title: Mountains May Depart
  category: movie
  cover_url: https://neodb.social/m/item/movie/2026/08/19/c630ed93-fe02-4114-8584-563d7176d726.jpeg
  created_time: '2025-04-20T13:57:55Z'
  shelf_type: complete
  comment_text: 前两段真的挺好的，时代浪潮滚滚向前，山河依旧，故人不再，但第三段实在是奇怪无聊到我坐立难安的程度，我不知道是他无法想象财产转移海外的生活，还是他理解中外国观众喜欢看这种找寻自我的旅程，不管逻辑剧情镜头都让人很难受。我很难想象六七岁还在中国、和他爸一起移居国外的小孩一点中文不会，我也不懂为啥要通过这个角色无病呻吟自由来表达乡愁，也很困惑为啥他反抗的表现形式就是和年长爱人开车四处兜风，甚至那个出现了无数次的美丽海滩镜头也意义不明。这个片子用完全不搭的第三段彻底摧毁了我对前两段的印象，极大的“反升华”了主题，留下一种难言的回味。
