- uuid: 07xN911ejZyqDZUzBjJVj9
  title: 'YATAGARASU: The Raven Does Not Choose Its Master (Yatagarasu: The Raven
    Does Not Choose Its Master)'
  category: tv
  cover_url: https://neodb.social/m/item/doubanmovie/2024/09/23/4b893efc-6a48-4c65-b890-074704583b35.jpg
  created_time: '2024-07-22T16:39:34.808Z'
  shelf_type: complete
  comment_text: "很多年前看过八咫烏系列小说第一部汉化，后来追了第二部的漫画。\r\n虽然制作说不上特别好但也还够看，比起动画更喜欢漫画人设，但四集看下来，瑕不掩瑜，会继续追\r\
    \n——————\r\n追完第一季对于节奏和台词都很满意。在场景上做了努力营造出和式古典之美，尤其是季终的特别EP，融入了包括燕子花图屏风在内的一系列日本画元素确实非常雅致。但是相对的，人物作画崩得很厉害，特别最后太子和すみ的对话，人物动作和神态都太不细致了。总体来说算是在经费有限的情况下有所取舍，尽可能展示了八咫烏宇宙的魅力吧"
- uuid: 5X4isRDXliDa6ArlcyVW25
  title: Oblivion Battery
  category: tv
  cover_url: https://neodb.social/m/item/tmdb_tv/2024/06/04/570a4ad8-c5ea-4265-8186-83ce917b0bff.jpg
  created_time: '2024-07-22T16:23:22.357Z'
  shelf_type: complete
  comment_text: "我的心灵疗愈之作。尽管有沉重的地方，但底色终究是青春物语。虽然过去万般痛苦，但只要仍在努力，未来就尚可改变。人物的困境用画面表现得很好，比赛的走向也与人物内心转变紧密相连，人物的蜕变在破釜沉舟尽力而为的瞬间。\r\
    \n尤其6集和11集二游间各自的单人回，是个人今年动画单回最佳。"
