- uuid: 6tiQIzeF9sSNEAovauxCwQ
  title: Fatherland
  category: movie
  cover_url: https://neodb.social/m/item/movie/2026/05/16/dcdc188a-0c11-45ec-b7aa-fed7e08b7d54.jpg
  created_time: '2026-10-18T16:31:16.933Z'
  shelf_type: complete
  comment_text: '26/10/18和JY在filmhouse观影。很喜欢。

    惠勒是我新的女神，她在坠落复杂，在hail mary里冷漠，在fatherland中感性，每个角色都那么立体又具有韵味，令人见之难忘。

    电影的趣味性在于它尽管是以声名在外的托马斯曼返回故土作为主线，女儿Erika才是真正的主角。她是那个支撑父亲给与他支持和反馈的重要角色，也一针见血地直指父亲的沉溺于宏大叙事、而对自己儿子之死冷漠回避。她富有智慧、精通多种语言、有极强的道德感，但又感性脆弱。

    有好几处剧情呼应都令人回味。Erika说巴赫是the only one that Klaus listens to，电影以父女两人在教堂废墟中倾听巴赫BWV
    147结尾，可能如同Klaus一般，得到了短暂而珍贵的平静。这几乎是神圣的一刻，在满目疮痍的故土，私人已逝，永恒的艺术如同上帝之手抚慰人心。

    战争结束了，之后是野心家们趁机用文化抢夺话语权的时机，西德的人们也许还愿意听听托马斯曼的深意，东德不过就是一种为了争取政治傀儡的staged act。但托马斯曼也做不到绝对的高尚，他还是无视了那个闯入他房间的反抗者，按照他的稿件继续宣传如何通过文化遗产成为一个“好的德国人”。所以他反而在演讲之后梦到用言语的堡垒武装的自己，在Klaus墓前的审视之下无所遁形。'
