- uuid: 1HFYv0gM9FOLuwe8REnXiB
  title: Persepolis Rising
  category: book
  cover_url: https://neodb.social/m/book/2021/10/26f48ce1bf-50bd-4599-9f99-afdceb84b582.jpg
  created_time: '2022-08-26T14:54:40.759Z'
  shelf_type: complete
  comment_text: "勒古恩在黑暗的左手的序言里说：科幻小说是一种思想实验，而这些思想实验并不是为了预测未来，而是为了描摹当下。\r\n这正是我对这本书的感想，作者借Laconia探讨的中心问题是：有没有好的集权体制？这个体制中的人共享同一个宏大目标，长期以最有效率而节制的方式试图把人类文明导向最光明的前景，这算不算足够好？作者借Holden，Drummer，Avasarala之口回答，如果不能让个人享有因良知而反抗集体的自由、如果不能让人自由地选择未来、如果有一些人始终优于另一些人，那么答案永远是不。他们相信反抗不公、反抗压迫、张扬自我的意识，永远深植于人类本性，而人个体的光芒，永远高于任何形式的集体。"
