- uuid: 0u79AQ54uF4WkBS452kB7G
  title: 渾名をくれ
  category: book
  cover_url: https://neodb.social/m/book/2021/11/014bb8ea08-0153-473e-a368-22326c5a2dd4.jpg
  created_time: '2021-07-12T14:33:48Z'
  shelf_type: complete
  comment_text: '不论是画面还是主题都令人心为之震颤的大作。

    新井老师在后记里说这是一个有关信仰的故事。它也是一个探寻爱的故事。爱一个人，一定要爱他的全部吗？只是爱他爱自己这一点，或只是把对方作为美的信仰而爱，难道就是不完全不够深沉的爱吗？爱的缘由也许并不重要，重要的是它可以推动着痛苦挣扎的个体突破禁锢，向另一个个体展露丑陋粗鄙的自我。虽然不是一个复杂的故事，却是一个把爱的自我怀疑画得极其动人，绝对值得反复重读的故事。'
