    久而久之，她会把他选作坐标。因为只有他一直支持她，只有他愿意放权给她，也只有他明明看见她的危险，却仍然给她怀抱。他要她把他的怀抱误认作安稳，把他的影子误认作归处。

    到最后，他不是最锋利的恶犬，却会成为她最离不开的那一个。'
