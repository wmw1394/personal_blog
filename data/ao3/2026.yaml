  summary: '玩游戏的时候是武后视角，礼治就像是一个工具人，只会放权、隐忍、原谅。可九五至尊、最后的胜利者，真的会如此简单吗？《忠犬的坐标》想写的，便是另一种可能，白切黑的礼治。

